[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel-ai"
version = "0.1.0"
description = "Standalone Windows Network Discovery and AI Security Auditing Desktop Application"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Vivek Nigam" }
]
dependencies = [
    "PySide6>=6.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pyinstaller>=6.11.0",
]

[project.scripts]
netsentinel = "netsentinel.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
addopts = "-v"
